function viewRows(route) {
  if (route === 'progress') return scoped('activities');
  if (route === 'readiness') return scoped('orders').filter(row => row.cadence === '주간').map(row => {
    const requirements = data.requirements.filter(req => req.activity === row.activity);
    const missing = requirements.reduce((total,req) => total + Math.max(0,req.qty -
      data.issues.filter(issue => issue.requirement === req.id).reduce((sum,issue) => sum + issue.qty,0)),0);
    const operation = data.operations.find(item => item.activity === row.activity);
    const facility = data.center_locations.find(item => item.center === operation?.center);
    return {...row, center_location:facility?.location ?? '', missing_qty:missing,
      linked_plan:row.plan_id ? '발행본 연결' : '계획 미연결',
      readiness:row.inspection === '합격' ? '완료' : missing ? '자재 출고 필요' :
        requirements.length ? '실적 등록 가능' : '자재 소요 확인 필요'};
  });
  if (route === 'quality_orders') {
    const histories = new Map();
    for (const result of scoped('production_results')) {
      if (!histories.has(result.work_order)) histories.set(result.work_order, []);
      histories.get(result.work_order).push(result);
    }
    return scoped('orders').map(order => {
      const history = histories.get(order.id) || [];
      const legacy = history.some(result => !result.recorded_at);
      const first = [...history].sort((a,b) => (a.recorded_at || '').localeCompare(b.recorded_at || '') ||
        a.id.localeCompare(b.id, 'en', {numeric:true}))[0];
      return {id:order.id, activity:order.activity, actual:order.actual,
        first_inspection:legacy ? '이전 이력 미확인' : first?.inspection,
        first_actual:legacy ? null : first?.actual,
        inspection:order.inspection, result:order.result,
        attempts:history.length, latest_result:history.at(-1)?.id};
    });

    field.required = required;
    if (options) {
      add(field,'option','선택').value = '';
      for (const [value, text] of options) add(field,'option',text).value = value;
    } else {
      field.type = dateFields.has(key) ? 'date' : ['x','y','load',...measures,...integerFields].includes(key) ? 'number' : 'text';
      field.maxLength = 1000;
      if (field.type === 'number') field.step = integerFields.includes(key) ? '1' : 'any';
      if (integerFields.includes(key)) field.min = ['stock','lead_days'].includes(key) ? 0 : 1;
      if (key === 'progress_pct') field.max = 100;
      if (measures.includes(key)) { field.min = 0.001; field.step = '0.001'; }
      if (key === 'load') field.min = 0;
    }
    if (preset[key] != null) field.value = preset[key];
    if (action === 'issues' && key === 'work_order') {
      field.onchange = () => {
        const selected = data.orders.find(order => order.id === field.value);
        const requirements = form.elements.requirement;
        requirements.replaceChildren();
        add(requirements,'option','선택').value = '';
        for (const req of scoped('requirements').filter(req => req.activity === selected?.activity)) {
          add(requirements,'option',req.id + ' · ' + req.material).value = req.id;
        }
      };
    }
  }
  const submit = add(form,'button',names[action]);
  submit.type = 'submit';
  form.onsubmit = async event => {
    event.preventDefault();
    submit.disabled = true;
    let saved;
    try {
      saved = await api(action,Object.fromEntries(new FormData(form)));
    } catch (error) {
      byId('entry-status').textContent = error.message;
      byId('entry-status').dataset.error = 'true';
      submit.disabled = false;
      return;
    }
    try {
      await refresh();
      entryDialog.close();
      preset = {};
      render(saved.id ? `${saved.id} 저장 완료` : '저장했습니다.');
      const next = follow(action,data[action]?.find(row => row.id === saved.id) || {});
      if (next && next[2] && Object.values(next[2]).every(value => value != null)) {
        const button = add(byId('next-actions'),'button',names[next[1]]);
        button.onclick = () => openGroup(...next);
      }
    } catch (error) {
      entryDialog.close();
      status('저장했습니다. 목록을 새로 고치려면 페이지를 다시 불러오세요.',true);
    }
  };
  entryDialog.showModal();
}
function render(message = '') {
  const nav = byId('tabs');
  nav.replaceChildren();
  for (const [label,pages] of Object.entries(modules)) {
    add(nav,'h2',label);
    for (const page of pages) {
      const button = add(nav,'button', page === overview ? '처리할 업무' : page);
      button.setAttribute('aria-pressed',String(group === page));
      button.onclick = () => openGroup(page);
    }
  }
  const filter = byId('hull-filter');
  filter.replaceChildren();
  add(filter,'option','전체 호선').value = '';
  for (const row of data.hulls) add(filter,'option',row.id + ' · ' + row.name).value = row.id;
  filter.value = hull;
  filter.onchange = () => { hull = filter.value; render(); filter.focus(); };
  const userSelect = byId('user-select');
  userSelect.replaceChildren();
  add(userSelect,'option',data.users.length ? '작업자 선택' : '권한 미사용').value = '';
  for (const row of data.users) add(userSelect,'option',row.id + ' · ' + row.name + ' (' + row.role + ')').value = row.id;
  userSelect.value = data.users.some(row => row.id === currentUser) ? currentUser : '';
  userSelect.onchange = () => {
    currentUser = userSelect.value;
    try { localStorage.setItem('shipyard-user', currentUser); } catch (error) { /* per-viewer convenience only */ }
  };
  byId('work').hidden = group === overview;
  const records = byId('records');
  records.replaceChildren();
  if (group === overview) {
    renderOverview(records);
    return;
  }
  const choices = views[group];
  const selected = choices.find(([route]) => route === view) || choices[0];
  const [route,step,heading] = selected;
  byId('heading').textContent = group;
  byId('step-help').hidden = true;
  byId('next-actions').replaceChildren();
  buttons(byId('actions'),choices.map(item => item[0]),route,
          key => choices.find(item => item[0] === key)[2],key => { view = key; lastViews[group] = key; render(); });
  byId('actions').setAttribute('role','tablist');
  byId('actions').setAttribute('aria-label',group + ' 조회 탭');
  [...byId('actions').children].forEach((button,index,buttons) => {
    const selected = choices[index][0] === route;
    button.setAttribute('role','tab');
    button.setAttribute('aria-selected',String(selected));
    button.tabIndex = selected ? 0 : -1;
    button.onkeydown = event => {
      const offset = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
      if (!offset) return;
      event.preventDefault();
      const next = (index + offset + buttons.length) % buttons.length;
      view = choices[next][0]; lastViews[group] = view; render();
      byId('actions').children[next].focus();
    };
  });
  const section = add(records,'section');
  const header = add(section,'div');
  header.className = 'list-header';
  const title = add(header,'h3',heading);
  const tools = add(header,'div');
  tools.className = 'list-tools';
  if (step) {
    const create = add(tools,'button',names[step]);
    create.className = 'primary';
    create.onclick = () => openEntry(step);
  }
  if (route === 'activities') add(tools,'button',names.forecast).onclick = () => openEntry('forecast');
  const rows = viewRows(route);
  let qualitySummary;
  if (route === 'quality_orders') {
    qualitySummary = add(section,'div');
    qualitySummary.className = 'home-metrics quality-summary';
  }
  const queryKey = group + '/' + route;
  const saved = listPreferences[queryKey] || {};
  const filters = add(section,'div');
  filters.className = 'filter-bar';
  const search = add(add(filters,'label','검색'),'input');
  search.type = 'search'; search.placeholder = '문서번호 · 품목명 · 공정'; search.value = saved.search || '';
  const select = (label,options,value) => {
    const field = add(add(filters,'label',label),'select');
    for (const [key,text] of options) add(field,'option',text).value = key;
    field.value = value;
    return field;
  };
  const states = [...new Set(rows.map(row => rowState(route,row)).filter(Boolean))];
  const state = select('처리 상태',[['','전체 상태'],...states.map(value => [value,value])],saved.state || '');
  state.parentElement.hidden = !states.length;
  const material = select('자재',[['','전체 자재'],...data.materials.map(row => [row.id,row.id + ' · ' + row.name])],saved.material || '');
  material.parentElement.hidden = !rows.some(row => 'material' in row);
  const location = select('창고·시설',[['','전체 위치'],...data.locations.map(row => [row.id,row.name])],saved.location || '');
  location.parentElement.hidden = !rows.some(row => 'location' in row || 'source' in row);
  const dateKeys = ['first_actual','day','need_day','promised_day','actual','forecast','start','recorded_at','issued_at'];
  const dateKey = route === 'quality_orders' ? 'first_actual' : dateKeys.find(key => rows.some(row => row[key]));
  const from = add(add(filters,'label',dateKey ? (labels[dateKey] || dateKey) + ' 시작' : '시작일'),'input');
  const until = add(add(filters,'label','종료일'),'input');
  from.type = until.type = 'date'; from.value = saved.from || ''; until.value = saved.until || '';
  from.parentElement.hidden = until.parentElement.hidden = !dateKey;
  const columns = rows.length ? Object.keys(rows[0]).filter(key => key !== 'snapshot') : ['id'];
  const sort = select('정렬 기준',columns.map(key => [key,labels[key] || key]),saved.sort || columns[0]);
  const direction = select('정렬 방향',[['asc','오름차순'],['desc','내림차순']],saved.direction || 'asc');
  const reset = add(filters,'button','조건 초기화');
  const body = add(section,'div');
  const pagination = add(section,'div'); pagination.className = 'pagination';
  let page = 0;
  const pageSize = 20;
  const update = () => {
    body.replaceChildren(); pagination.replaceChildren();
    const query = {search:search.value,state:state.value,material:material.value,location:location.value,
      from:from.value,until:until.value,sort:sort.value,direction:direction.value};
    listPreferences[queryKey] = query;
    if (from.value && until.value && from.value > until.value) {
      add(body,'p','시작일은 종료일 이전으로 선택하세요.'); return;
    }
    const term = search.value.trim().toLowerCase();
    const hits = rows.filter(row => {
      const names = [data.materials.find(item => item.id === row.material)?.name,
        data.activities.find(item => item.id === row.activity)?.stage];
      const searchable = [...Object.values(row),...names].map(value => typeof value === 'object' ? JSON.stringify(value) : String(value ?? '')).join(' ').toLowerCase();
      const day = String(row[dateKey] || '').slice(0,10);
      return (!term || searchable.includes(term)) && (!state.value || rowState(route,row) === state.value) &&
        (material.parentElement.hidden || !material.value || row.material === material.value) &&
        (location.parentElement.hidden || !location.value || row.location === location.value || row.source === location.value) &&
        (!dateKey || ((!from.value || day >= from.value) && (!until.value || (day && day <= until.value))));
    });
    hits.sort((a,b) => {
      const left = a[sort.value], right = b[sort.value];
      const order = typeof left === 'number' && typeof right === 'number' ? left-right :
        String(left ?? '').localeCompare(String(right ?? ''),'ko',{numeric:true});
      return direction.value === 'desc' ? -order : order;
    });
    if (qualitySummary) {
      qualitySummary.replaceChildren();
      const inspected = hits.filter(row => ['합격','불합격'].includes(row.first_inspection));
      const failed = inspected.filter(row => row.first_inspection === '불합격').length;
      const pending = hits.filter(row => row.inspection === '불합격').length;
      for (const [label,value] of [['최초 불합격률',inspected.length ? (100*failed/inspected.length).toFixed(1)+'%' : '집계 없음'],
        ['최초 검사 불합격 / 확인 건수',failed+' / '+inspected.length+'건'],['현재 재검사 필요',pending+'건']]) {
        const card = add(qualitySummary,'div');
        add(card,'span',label);
        add(card,'strong',value);
      }
      add(qualitySummary,'p','조회 조건에 해당하는 작업지시 기준입니다. 최초 검사 이력이 확인된 지시만 불합격률에 포함합니다.');
    }
    title.textContent = heading + ' (' + hits.length + '건)';
    const pages = Math.max(1,Math.ceil(hits.length/pageSize));
    page = Math.min(page,pages-1);
    if (!hits.length) add(body,'p','조건에 맞는 문서가 없습니다. 검색 조건을 초기화하거나 새 문서를 등록하세요.');
    else renderList(body,route,hits.slice(page*pageSize,(page+1)*pageSize));
    const previous = add(pagination,'button','이전'); previous.disabled = page === 0;
    previous.onclick = () => { page--; update(); };
    add(pagination,'span',(page+1) + ' / ' + pages + ' 페이지 · 페이지당 20건');
    const next = add(pagination,'button','다음'); next.disabled = page+1 >= pages;
    next.onclick = () => { page++; update(); };
  };
  const apply = () => { page = 0; update(); };
  search.oninput = apply;
  for (const field of [state,material,location,from,until,sort,direction]) field.onchange = apply;
  reset.onclick = () => {
    search.value = state.value = material.value = location.value = from.value = until.value = '';
    sort.value = columns[0]; direction.value = 'asc'; apply();
  };
  update();
  status(message);
}

function renderList(section, route, items) {
    if (route === 'block_readiness') {
      for (const block of items) {
        const details = add(section,'details');
        add(details,'summary',block.id + ' · ' + block.readiness + (block.forecast ? ' · 탑재 예정 ' + block.forecast : ''));
        add(details,'p',block.blockers || '등록된 준비 조건을 모두 확인했습니다.');
        table(details,block.checks);
        add(details,'button','준비 항목 확인').onclick = () => openEntry('block_gate_checks',{block:block.id});
      }
    } else if (route === 'plans' && items.length) {
      for (const plan of items) {
        const details = add(section,'details');
        add(details,'summary',`${plan.document_no} · ${plan.start}부터 ${plan.end_exclusive} 전까지 · ${new Date(plan.issued_at).toLocaleString('ko-KR')}`);
        const trace = add(details,'button','계획 문서 추적');
        trace.onclick = () => showTrace('plans',plan);
        const rows = hull ? plan.snapshot.filter(row => row.hull === hull) : plan.snapshot;
        table(details, rows, 'activities', false);
        for (const row of rows.filter(row => !data.activities.find(activity => activity.id === row.id)?.actual)) {
          const create = add(details,'button',row.id + ' 작업지시');
          create.className = 'record-action';
          create.onclick = () => {
            const date = new Date((row.forecast < plan.end_exclusive && row.forecast >= plan.start ? row.forecast : row.baseline) + 'T00:00:00Z');
            date.setUTCDate(date.getUTCDate() - (date.getUTCDay() + 6) % 7);
            openGroup('작업지시·실적','orders',{activity:row.id,plan_id:plan.id,cadence:'주간',day:date.toISOString().slice(0,10)});
          };
        }
      }
    } else table(section,items,route);
}

Promise.all([api('meta'),refresh()]).then(([metadata]) => {
  meta = metadata;
  for (const key of meta.dates) dateFields.add(key);
  for (const key of meta.integers) if (!integerFields.includes(key)) integerFields.push(key);
  for (const key of meta.measures) if (!measures.includes(key)) measures.push(key);
  render();
})
  .catch(error => { byId('work').hidden = false; status(error.message,true); });
</script>
</html>
