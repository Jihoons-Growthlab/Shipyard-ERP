services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shipyard
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: ${SHIPYARD_DB_PASSWORD:?Set SHIPYARD_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
